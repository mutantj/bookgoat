<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bookgoat</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <meta name="theme-color" content="#173236" />
    <!-- App icons: Rapunzel's face, made by scripts/make-icons.mjs -->
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bookgoat" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div id="splash-goat" class="goat splash-goat" aria-hidden="true"></div>
        <h1 class="splash-title">Bookgoat</h1>
        <p id="splash-saved" class="splash-saved" hidden></p>
        <div class="splash-actions">
          <div class="mode-row">
            <button id="btn-start" class="btn btn-feed" type="button" disabled>Loading…</button>
            <button id="btn-board-classic" class="btn btn-board" type="button" aria-label="Classic leaderboard" title="Classic leaderboard" hidden></button>
          </div>
          <div class="mode-row">
            <button id="btn-blitz" class="btn btn-blitz" type="button" disabled>Blitz · 1 minute</button>
            <button id="btn-board-blitz" class="btn btn-board" type="button" aria-label="Blitz leaderboard" title="Blitz leaderboard" hidden></button>
          </div>
          <button id="btn-adventure" class="btn btn-blitz" type="button" disabled>Adventure (preview)</button>
        </div>
        <p id="splash-version" class="splash-version"></p>
      </div>
    </div>
    <div id="app" class="app">
      <header class="hud">
        <div class="brand">
          <span class="brand-name">Bookgoat</span>
          <span id="mode-chip" class="mode-chip">Classic</span>
        </div>
        <div class="score-block">
          <span class="label">Score</span>
          <span id="score" class="score">0</span>
        </div>
        <div class="clock-block">
          <span class="label">Time</span>
          <span id="clock" class="clock">1:00</span>
        </div>
        <div class="level-block">
          <div class="level-row">
            <span class="label">Level <b id="level">1</b></span>
            <span id="level-progress-text" class="progress-text">0 / 400</span>
          </div>
          <div class="hay" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" id="hay">
            <div id="hay-fill" class="hay-fill"></div>
          </div>
        </div>
      </header>

      <main class="play">
        <section class="stage">
          <div class="goat-row">
            <div id="goat" class="goat" aria-hidden="true"></div>
            <div class="bubble" id="bubble" aria-live="polite">Spell a word and I'll eat it.</div>
          </div>
          <div class="bonus">
            <span class="label">Bonus word</span>
            <span id="bonus-word" class="bonus-word">—</span>
          </div>
        </section>

        <section class="board-area">
          <div class="word-bar">
            <span id="current-word" class="current-word" aria-live="polite">&nbsp;</span>
            <span id="current-points" class="current-points"></span>
          </div>
          <div id="board-wrap" class="board-wrap">
            <div id="board" class="board" role="grid" aria-label="Letter board">
              <svg id="chain" class="chain" aria-hidden="true"></svg>
            </div>
          </div>
          <div class="controls">
            <button id="btn-scramble" class="btn btn-quiet" type="button" title="Shuffle all letters (adds a fire tile)">Scramble</button>
            <button id="btn-clear" class="btn btn-quiet" type="button">Clear</button>
            <button id="btn-feed" class="btn btn-feed" type="button" disabled>Feed Rapunzel</button>
          </div>
        </section>

        <aside class="side">
          <div class="stats">
            <div><span class="label">Longest</span><span id="stat-longest" class="stat">—</span></div>
            <div><span class="label">Best word</span><span id="stat-best" class="stat">—</span></div>
            <div><span class="label">Words</span><span id="stat-words" class="stat">0</span></div>
          </div>
          <div class="history-block">
            <span class="label">Recent words</span>
            <ol id="history" class="history"></ol>
          </div>
          <div class="side-actions">
            <button id="btn-new" class="btn btn-quiet" type="button">New game</button>
            <button id="btn-home" class="btn btn-quiet" type="button">Home</button>
            <button id="btn-help" class="btn btn-quiet" type="button">How to play</button>
          </div>
        </aside>
      </main>

      <div id="overlay" class="overlay" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
          <h2 id="overlay-title"></h2>
          <div id="overlay-body"></div>
          <div id="overlay-actions" class="card-actions"></div>
        </div>
      </div>
      <div id="toast" class="toast" hidden></div>
      <div id="fly-layer" class="fly-layer" aria-hidden="true"></div>
      <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
    </div>
    <div id="adventure" class="adventure" hidden>
      <header class="adv-top">
        <div class="adv-top-row">
          <div class="adv-title">
            <span id="adv-chapter" class="label"></span>
            <span id="adv-stage" class="adv-stage"></span>
          </div>
          <span id="adv-battle" class="adv-chip"></span>
          <button id="adv-menu-open" class="btn adv-home" type="button" aria-label="Menu" title="Menu"></button>
        </div>
        <div class="adv-health">
          <div id="adv-hero-bar" class="adv-bar adv-bar-hero">
            <div class="adv-name-row"><span class="adv-name">Rapunzel <span id="adv-hero-status" class="adv-hero-status"></span></span><span id="adv-hero-hp-text" class="adv-hp-text"></span></div>
            <div class="adv-hp" aria-label="Rapunzel's health"><div id="adv-hero-hp" class="adv-hp-fill"></div></div>
          </div>
          <div class="adv-bar adv-bar-foe">
            <div class="adv-name-row"><span id="adv-enemy-name" class="adv-name"></span><span id="adv-enemy-hp-text" class="adv-hp-text"></span></div>
            <div class="adv-hp" aria-label="Enemy health"><div id="adv-enemy-hp" class="adv-hp-fill"></div></div>
          </div>
        </div>
      </header>

      <section class="adv-arena">
        <button id="adv-skip" class="adv-skip" type="button" hidden>Skip tutorial</button>
        <div id="adv-bubble" class="adv-bubble" aria-live="polite"></div>
        <div class="adv-fighters">
          <div id="adv-hero" class="adv-fighter adv-hero">
            <div id="adv-goat" class="goat adv-sprite" aria-hidden="true"></div>
          </div>
          <div id="adv-enemy-wrap" class="adv-fighter adv-foe">
            <div id="adv-enemy" class="adv-sprite" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <div id="adv-word-bar" class="adv-word-bar">
        <div id="adv-word" class="adv-tray" aria-live="polite" aria-label="Your word"></div>
        <span id="adv-damage" class="adv-damage"></span>
      </div>
      <div class="adv-play">
        <div id="adv-powers" class="adv-powers" aria-label="Artifacts"></div>
        <div id="adv-board" class="adv-board" role="grid" aria-label="Letter board"></div>
        <button id="adv-attack" class="btn btn-feed adv-attack" type="button" disabled>Attack!</button>
        <aside id="adv-info" class="adv-info" aria-label="About the enemy"></aside>
      </div>

      <div id="adv-menu" class="overlay" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="adv-menu-title">
          <h2 id="adv-menu-title"></h2>
          <p id="adv-menu-text"></p>
          <div id="adv-menu-actions" class="adv-menu-actions"></div>
        </div>
      </div>

      <div id="adv-result" class="overlay" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="adv-result-title">
          <h2 id="adv-result-title"></h2>
          <p id="adv-result-text"></p>
          <div class="card-actions"><button id="adv-result-go" class="btn btn-feed" type="button"></button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
