name = "bookgoat-scores"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "bookgoat-scores"
# Replace with the id printed by `npx wrangler d1 create bookgoat-scores` (see README.md).
database_id = "00000000-0000-0000-0000-000000000000"

# Caps how often one connection can post. Counted in memory; nothing is stored.
[[ratelimits]]
name = "POST_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
